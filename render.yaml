# Render Blueprint Specification
# Link this repository to Render.com under "Blueprints" to deploy automatically.
services:
  - type: web
    name: transport-portal-backend
    env: python
    plan: free # Deploys on Render's Free tier
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGO_URI
        sync: false # Render will prompt you to enter your MongoDB connection string
      - key: MONGO_DB_NAME
        value: transport_portal
      - key: JWT_SECRET_KEY
        generateValue: true # Generates a secure random 256-bit key automatically
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: APP_BASE_URL
        sync: false # The URL of this deployed service (e.g., https://transport-portal-backend.onrender.com)
      - key: N8N_WEBHOOK_URL
        sync: false # Optional: n8n webhook URL
      - key: WHATSAPP_API_TOKEN
        sync: false # Optional: WhatsApp Meta API token
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false # Optional: WhatsApp Meta phone number ID
